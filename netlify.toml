# GymFlow na Netlify: frontend (apps/web) + API (Netlify Functions).
# Base de dados: DATABASE_URL (Postgres). Sem ela, a API corre em modo demonstração com um
# Postgres em memória (PGlite) semeado em cada arranque — os dados não persistem.
#
# Variáveis de ambiente a definir no painel do site:
#   SETUP_TOKEN   código para o assistente de configuração inicial (/setup) — obrigatório
#   CRON_SECRET   (opcional) para chamar POST /api/cron/reminders a partir de fora
#   WHATSAPP_* / SMTP_* / SMS_*   fornecedores de notificações (ver .env.example)
#   DATABASE_URL  (opcional) Postgres para dados persistentes
# URL é definida automaticamente pela Netlify.

[build]
  command = "npm run build:netlify"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # O Prisma carrega o compilador de queries (WASM) do disco: tem de ir junto com a função.
  # O PGlite (modo demonstração) também lê os seus ficheiros .wasm/.data do disco.
  external_node_modules = ["@prisma/client", ".prisma", "@prisma/adapter-pg", "pg", "@electric-sql/pglite", "@electric-sql/pglite-socket"]
  included_files = [
    "node_modules/.prisma/client/**",
    "!node_modules/.prisma/client/libquery_engine-*",
    "!node_modules/.prisma/client/query_engine_bg.*",
  ]

# A API é servida em /api/* pela própria função (config.path em netlify/functions/api.mts).

# SPA: todas as outras rotas servem index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev -w @gymflow/web"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
