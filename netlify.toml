# GymFlow na Netlify: frontend (apps/web) + API (Netlify Functions) + Netlify Database (Postgres).
#
# Variáveis de ambiente a definir no painel do site:
#   SETUP_TOKEN   código para o assistente de configuração inicial (/setup) — obrigatório
#   CRON_SECRET   (opcional) para chamar POST /api/cron/reminders a partir de fora
#   WHATSAPP_* / SMTP_* / SMS_*   fornecedores de notificações (ver .env.example)
# NETLIFY_DB_URL e URL são definidas automaticamente pela Netlify.

[build]
  command = "npm run build:netlify"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # O Prisma carrega o compilador de queries (WASM) do disco: tem de ir junto com a função.
  external_node_modules = ["@prisma/client", ".prisma", "@prisma/adapter-pg", "pg"]
  included_files = [
    "node_modules/.prisma/client/**",
    "!node_modules/.prisma/client/libquery_engine-*",
    "!node_modules/.prisma/client/query_engine_bg.*",
  ]

# API no mesmo domínio
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA: todas as outras rotas servem index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev -w @gymflow/web"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
